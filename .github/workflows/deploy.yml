name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh BIRD Data
    types:
      - completed

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Restore raw BIRD data from bird-data branch
        run: |
          git fetch origin bird-data
          git cat-file -e origin/bird-data:data/steam-cache-v4.txt
          git cat-file -e origin/bird-data:data/steam-cache-v6.txt
          mkdir -p data
          git show origin/bird-data:data/steam-cache-v4.txt > data/steam-cache-v4.txt
          git show origin/bird-data:data/steam-cache-v6.txt > data/steam-cache-v6.txt

      - name: Create deployment directory
        run: |
          mkdir -p deploy

      - name: Copy files to deployment directory
        run: |
          cp index.html deploy/
          cp script.js deploy/
          cp styles.css deploy/
          cp -r assets deploy/
          mkdir -p deploy/data
          echo "steam.twds.com.tw" > deploy/CNAME

      - name: Build JSON files from source data
        run: |
          python3 convert_steam_cache_unified.py
          cp data/*.json deploy/data/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
